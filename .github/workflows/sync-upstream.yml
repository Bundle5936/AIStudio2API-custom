name: Sync upstream

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write
  issues: write

concurrency:
  group: upstream-sync-aistudio
  cancel-in-progress: false

env:
  TARGET_BRANCH: main
  UPSTREAM_REPO: Mag1cFall/AIStudio2API

jobs:
  sync:
    name: Sync upstream with downstream file guard
    runs-on: ubuntu-latest
    steps:
      - name: Check out maintained branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Compare upstream and downstream file sets
        id: compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null || true
          git fetch upstream main --prune

          upstream_sha="$(git rev-parse upstream/main)"
          upstream_title="$(git log -1 --format=%s upstream/main)"
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "status=already_current" >> "$GITHUB_OUTPUT"
            echo "upstream_sha=${upstream_sha}" >> "$GITHUB_OUTPUT"
            echo "upstream_title=${upstream_title}" >> "$GITHUB_OUTPUT"
            echo "Upstream is already contained in ${TARGET_BRANCH}."
            exit 0
          fi

          # The merge base is the last upstream revision already represented by
          # the maintained branch. Compare only changes since that revision.
          old_base="$(git merge-base HEAD upstream/main)"
          upstream_files="$(git diff --name-only "$old_base" upstream/main | sort -u)"
          downstream_files="$(git diff --name-only "$old_base" HEAD | sort -u)"
          overlap="$(comm -12 \
            <(printf '%s\n' "$upstream_files" | sed '/^$/d' | sort -u) \
            <(printf '%s\n' "$downstream_files" | sed '/^$/d' | sort -u) \
          )"

          {
            echo "upstream_sha=${upstream_sha}"
            echo "upstream_title<<SYNC_EOF"
            echo "$upstream_title"
            echo "SYNC_EOF"
            echo "old_base=${old_base}"
            echo "upstream_files<<SYNC_EOF"
            echo "$upstream_files"
            echo "SYNC_EOF"
            echo "downstream_files<<SYNC_EOF"
            echo "$downstream_files"
            echo "SYNC_EOF"
            echo "overlap<<SYNC_EOF"
            echo "$overlap"
            echo "SYNC_EOF"
          } >> "$GITHUB_OUTPUT"

          if [ -n "$overlap" ]; then
            body_file="$(mktemp)"
            {
              echo "## Downstream review required"
              echo
              echo "The upstream update overlaps files changed by this downstream fork. The maintained branch was not changed."
              echo
              echo "- Upstream repository: ${UPSTREAM_REPO}"
              echo "- Upstream commit: ${upstream_sha} (${upstream_title})"
              echo "- Previously synchronized base: ${old_base}"
              echo
              echo "### Overlapping files"
              echo '```text'
              echo "$overlap"
              echo '```'
              echo
              echo "### Review policy"
              echo "1. Inspect the upstream changes in the overlapping files."
              echo "2. If upstream already provides the downstream behavior, remove the redundant local code and follow upstream."
              echo "3. If upstream only changed the surrounding implementation, adapt the downstream behavior to the new code."
              echo "4. Run the repository validation and push the reviewed result."
              echo
              echo "Actions run: https://github.com/${GITHUB_REPOSITORY}/actions"
            } > "$body_file"

            existing="$(gh issue list --state open --search "[upstream-sync] Review ${upstream_sha:0:8} in:title" --json number --jq 'length')"
            if [ "$existing" = "0" ]; then
              gh issue create \
                --title "[upstream-sync] Review overlapping downstream files (${upstream_sha:0:8})" \
                --body-file "$body_file" || true
            fi
            rm -f "$body_file"
            echo "status=overlap" >> "$GITHUB_OUTPUT"
            exit 10
          fi

          candidate_branch="sync-check-${GITHUB_RUN_ID}"
          git checkout -b "$candidate_branch"
          if ! git merge --no-commit --no-ff upstream/main; then
            conflict_files="$(git diff --name-only --diff-filter=U | sort -u || true)"
            git merge --abort || git reset --hard HEAD
            body_file="$(mktemp)"
            {
              echo "## Upstream merge conflict"
              echo
              echo "The file guard found no direct overlap, but the candidate merge still conflicted. The maintained branch was not changed."
              echo
              echo "- Upstream commit: ${upstream_sha}"
              echo "- **Conflict files**:"
              echo '```text'
              echo "$conflict_files"
              echo '```'
              echo
              echo "Actions run: https://github.com/${GITHUB_REPOSITORY}/actions"
            } > "$body_file"
            gh issue create \
              --title "[upstream-sync] Merge conflict (${upstream_sha:0:8})" \
              --body-file "$body_file" || true
            rm -f "$body_file"
            echo "status=merge_conflict" >> "$GITHUB_OUTPUT"
            exit 10
          fi

          echo "candidate_branch=${candidate_branch}" >> "$GITHUB_OUTPUT"
          echo "status=clean" >> "$GITHUB_OUTPUT"
          echo "No downstream file overlap. Candidate merge is ready for validation."

      - name: Run Go validation
        if: steps.compare.outputs.status == 'clean'
        run: go test ./...

      - name: Run frontend validation
        if: steps.compare.outputs.status == 'clean'
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Validate the container build
        if: steps.compare.outputs.status == 'clean'
        run: docker build --file Dockerfile.custom --tag aistudio-omni:upstream-sync .

      - name: Promote the validated candidate
        if: steps.compare.outputs.status == 'clean'
        env:
          CANDIDATE_BRANCH: ${{ steps.compare.outputs.candidate_branch }}
          UPSTREAM_SHA: ${{ steps.compare.outputs.upstream_sha }}
          UPSTREAM_TITLE: ${{ steps.compare.outputs.upstream_title }}
        run: |
          set -euo pipefail
          git commit -m "chore(sync): merge upstream main (${UPSTREAM_SHA:0:8})"
          git checkout "${TARGET_BRANCH}"
          git merge --ff-only "${CANDIDATE_BRANCH}"
          git push origin "${TARGET_BRANCH}"
          echo "Promoted upstream ${UPSTREAM_SHA} (${UPSTREAM_TITLE}) to ${TARGET_BRANCH}."
