name: Sync upstream

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write
  issues: write

concurrency:
  group: upstream-sync-aistudio
  cancel-in-progress: false

env:
  TARGET_BRANCH: main
  UPSTREAM_REPO: Mag1cFall/AIStudio2API

jobs:
  sync:
    name: Sync upstream with Git merge conflict detection
    runs-on: ubuntu-latest
    steps:
      - name: Check out maintained branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Merge upstream into candidate branch
        id: compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null || true
          git fetch upstream main --prune

          upstream_sha="$(git rev-parse upstream/main)"
          upstream_title="$(git log -1 --format=%s upstream/main)"
          {
            echo "upstream_sha=${upstream_sha}"
            echo "upstream_title<<SYNC_EOF"
            echo "$upstream_title"
            echo "SYNC_EOF"
          } >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "status=already_current" >> "$GITHUB_OUTPUT"
            echo "Upstream is already contained in ${TARGET_BRANCH}."
            exit 0
          fi

          candidate_branch="sync-check-${GITHUB_RUN_ID}"
          git checkout -b "$candidate_branch"
          if git merge --no-commit --no-ff upstream/main; then
            echo "candidate_branch=${candidate_branch}" >> "$GITHUB_OUTPUT"
            echo "status=clean" >> "$GITHUB_OUTPUT"
            echo "Upstream merge completed without textual conflicts."
            exit 0
          fi

          conflict_files="$(git diff --name-only --diff-filter=U | sort -u || true)"
          if [ -z "$conflict_files" ]; then
            conflict_files="(merge failed without a normal unmerged-file list; inspect the workflow log)"
          fi
          git merge --abort || git reset --hard HEAD

          body_file="$(mktemp)"
          {
            echo "## Upstream merge conflict"
            echo
            echo "The candidate merge of upstream ${UPSTREAM_REPO} conflicted. The maintained branch was not changed."
            echo
            echo "- Upstream commit: ${upstream_sha} (${upstream_title})"
            echo "- **Conflicting files:**"
            echo '```text'
            echo "$conflict_files"
            echo '```'
            echo
            echo "A clean Git merge is required before automated tests, container validation, and promotion can continue."
            echo
            echo "Actions run: https://github.com/${GITHUB_REPOSITORY}/actions"
          } > "$body_file"

          existing="$(gh issue list --state open --search "[upstream-sync] Merge conflict ${upstream_sha:0:8} in:title" --json number --jq 'length')"
          if [ "$existing" = "0" ]; then
            gh issue create \
              --title "[upstream-sync] Merge conflict (${upstream_sha:0:8})" \
              --body-file "$body_file" || true
          fi
          rm -f "$body_file"
          echo "status=merge_conflict" >> "$GITHUB_OUTPUT"
          exit 10

      - name: Check merged diff
        if: steps.compare.outputs.status == 'clean'
        run: git diff --cached --check

      - name: Run Go validation
        if: steps.compare.outputs.status == 'clean'
        run: go test ./...

      - name: Run frontend validation
        if: steps.compare.outputs.status == 'clean'
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Validate the container build
        if: steps.compare.outputs.status == 'clean'
        run: docker build --file Dockerfile.custom --tag aistudio-omni:upstream-sync .

      - name: Promote the validated candidate
        if: steps.compare.outputs.status == 'clean'
        env:
          CANDIDATE_BRANCH: ${{ steps.compare.outputs.candidate_branch }}
          UPSTREAM_SHA: ${{ steps.compare.outputs.upstream_sha }}
          UPSTREAM_TITLE: ${{ steps.compare.outputs.upstream_title }}
        run: |
          set -euo pipefail
          git commit -m "chore(sync): merge upstream main (${UPSTREAM_SHA:0:8})"
          git checkout "${TARGET_BRANCH}"
          git merge --ff-only "${CANDIDATE_BRANCH}"
          git push origin "${TARGET_BRANCH}"
          echo "Promoted upstream ${UPSTREAM_SHA} (${UPSTREAM_TITLE}) to ${TARGET_BRANCH}."
